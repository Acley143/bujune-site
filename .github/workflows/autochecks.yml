# Runs type checking and linting on every push/PR to main
name: Autochecks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  autocheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm lint:types
      - run: pnpm lint
